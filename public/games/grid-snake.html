<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Snake</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        color: #f3f5f8;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .wrap {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        gap: 10px;
      }
      .hud {
        width: 100%;
        max-width: 560px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: #161a22;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .hud-stats {
        display: flex;
        gap: 18px;
      }
      .hud-label {
        color: #8b95a5;
        margin-right: 4px;
      }
      .hud-val {
        font-weight: 700;
      }
      .hud-actions {
        display: flex;
        gap: 8px;
      }
      .hud-btn {
        background: #212733;
        color: #f3f5f8;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .stage {
        position: relative;
        width: 100%;
        max-width: 560px;
        aspect-ratio: 1 / 1;
        max-height: calc(100vh - 84px);
      }
      canvas {
        width: 100%;
        height: 100%;
        background: #0f141c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: rgba(11, 13, 18, 0.85);
        border-radius: 12px;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .overlay p {
        margin: 0 0 18px;
        color: #9aa4b2;
        font-size: 14px;
        max-width: 340px;
      }
      .btn-play {
        background: #f59e0b;
        color: #11141a;
        border: 0;
        border-radius: 8px;
        padding: 11px 22px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hud">
        <div class="hud-stats">
          <div><span class="hud-label">Score</span><span id="scoreVal" class="hud-val">0</span></div>
          <div><span class="hud-label">Length</span><span id="lenVal" class="hud-val">3</span></div>
          <div><span class="hud-label">Best</span><span id="bestVal" class="hud-val">0</span></div>
        </div>
        <div class="hud-actions">
          <button type="button" id="pauseBtn" class="hud-btn">Pause</button>
          <button type="button" id="muteBtn" class="hud-btn">Sound On</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="canvas" width="520" height="520"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlayTitle">Grid Snake</h1>
          <p id="overlayText">Use Arrow keys or WASD to steer. Collect golden cores to grow without hitting walls or your own tail.</p>
          <button type="button" id="startBtn" class="btn-play">Start Game</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const muteBtn = document.getElementById('muteBtn');
      const scoreEl = document.getElementById('scoreVal');
      const lenEl = document.getElementById('lenVal');
      const bestEl = document.getElementById('bestVal');

      const GRID = 20;
      const CELL = canvas.width / GRID;
      const BEST_KEY = 'arcadevault_snake_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = best;

      let muted = false;
      let audioCtx = null;
      function tone(freq, dur) {
        if (muted) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.06, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start();
          o.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? 'Sound Off' : 'Sound On';
      });

      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = { x: 14, y: 10 };
      let score = 0;
      let running = false;
      let paused = false;
      let timer = null;
      let tickMs = 115;

      function placeFood() {
        while (true) {
          const x = Math.floor(Math.random() * GRID);
          const y = Math.floor(Math.random() * GRID);
          if (!snake.some((s) => s.x === x && s.y === y)) {
            food = { x, y };
            return;
          }
        }
      }

      function startGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        tickMs = 115;
        paused = false;
        running = true;
        pauseBtn.textContent = 'Pause';
        placeFood();
        syncHud();
        overlay.hidden = true;
        schedule();
      }

      function syncHud() {
        scoreEl.textContent = score;
        lenEl.textContent = snake.length;
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = best;
        }
      }

      function schedule() {
        clearTimeout(timer);
        if (!running || paused) return;
        timer = setTimeout(step, tickMs);
      }

      function step() {
        if (!running || paused) return;
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID || snake.some((s) => s.x === head.x && s.y === head.y)) {
          running = false;
          tone(130, 0.25);
          overlayTitle.textContent = 'Game Over';
          overlayText.textContent = `Score: ${score} · Final length: ${snake.length}.`;
          startBtn.textContent = 'Play Again';
          overlay.hidden = false;
          draw();
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          tickMs = Math.max(62, tickMs - 2);
          tone(540, 0.08);
          placeFood();
          syncHud();
        } else {
          snake.pop();
        }

        draw();
        schedule();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(canvas.width, i * CELL);
          ctx.stroke();
        }

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.34, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((seg, idx) => {
          const pad = idx === 0 ? 2 : 3;
          ctx.fillStyle = idx === 0 ? '#34d399' : idx % 2 === 0 ? '#10b981' : '#059669';
          ctx.beginPath();
          ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
          ctx.fill();
        });
      }

      function togglePause() {
        if (!running) return;
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        if (!paused) schedule();
      }

      pauseBtn.addEventListener('click', togglePause);
      startBtn.addEventListener('click', startGame);

      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
          e.preventDefault();
        }
        if (e.key === 'p' || e.key === 'P') {
          togglePause();
          return;
        }
        const map = {
          ArrowUp: { x: 0, y: -1 },
          KeyW: { x: 0, y: -1 },
          ArrowDown: { x: 0, y: 1 },
          KeyS: { x: 0, y: 1 },
          ArrowLeft: { x: -1, y: 0 },
          KeyA: { x: -1, y: 0 },
          ArrowRight: { x: 1, y: 0 },
          KeyD: { x: 1, y: 0 },
        };
        const cand = map[e.code];
        if (cand && (cand.x !== -dir.x || cand.y !== -dir.y)) {
          nextDir = cand;
        }
      });

      let touchStart = null;
      canvas.addEventListener('touchstart', (e) => {
        touchStart = e.touches[0];
      });
      canvas.addEventListener('touchend', (e) => {
        if (!touchStart) return;
        const dx = e.changedTouches[0].clientX - touchStart.clientX;
        const dy = e.changedTouches[0].clientY - touchStart.clientY;
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 20 && dir.x !== -1) nextDir = { x: 1, y: 0 };
          if (dx < -20 && dir.x !== 1) nextDir = { x: -1, y: 0 };
        } else {
          if (dy > 20 && dir.y !== -1) nextDir = { x: 0, y: 1 };
          if (dy < -20 && dir.y !== 1) nextDir = { x: 0, y: -1 };
        }
      });

      draw();
    </script>
  </body>
</html>
