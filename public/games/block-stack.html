<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Stack</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        color: #f3f5f8;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
        gap: 18px;
      }
      .board-box {
        position: relative;
        height: min(560px, calc(100vh - 28px));
        aspect-ratio: 1 / 2;
      }
      canvas#board {
        width: 100%;
        height: 100%;
        background: #11151d;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        display: block;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 160px;
      }
      .panel {
        background: #161a22;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 12px;
        font-variant-numeric: tabular-nums;
      }
      .label {
        font-size: 12px;
        color: #8b95a5;
        margin-bottom: 4px;
      }
      .val {
        font-size: 22px;
        font-weight: 700;
      }
      canvas#next {
        display: block;
        width: 100%;
        height: 88px;
        background: #10131a;
        border-radius: 6px;
        margin-top: 6px;
      }
      .btn {
        background: #212733;
        color: #f3f5f8;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: rgba(11, 13, 18, 0.86);
        border-radius: 12px;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      .overlay p {
        margin: 0 0 16px;
        color: #9aa4b2;
        font-size: 13px;
        line-height: 1.45;
      }
      .btn-play {
        background: #f59e0b;
        color: #11141a;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="board-box">
        <canvas id="board" width="250" height="500"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlayTitle">Block Stack</h1>
          <p id="overlayText">Left/Right to move, Up to rotate, Down to soft drop, Space to hard drop.</p>
          <button type="button" id="startBtn" class="btn-play">Start Game</button>
        </div>
      </div>

      <div class="sidebar">
        <div class="panel">
          <div class="label">Next Piece</div>
          <canvas id="next" width="120" height="88"></canvas>
        </div>
        <div class="panel">
          <div class="label">Score</div>
          <div id="scoreVal" class="val">0</div>
        </div>
        <div class="panel">
          <div class="label">Lines</div>
          <div id="linesVal" class="val">0</div>
        </div>
        <div class="panel">
          <div class="label">Level</div>
          <div id="levelVal" class="val">1</div>
        </div>
        <button type="button" id="pauseBtn" class="btn">Pause</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const nextCanvas = document.getElementById('next');
      const nextCtx = nextCanvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const scoreEl = document.getElementById('scoreVal');
      const linesEl = document.getElementById('linesVal');
      const levelEl = document.getElementById('levelVal');

      const COLS = 10;
      const ROWS = 20;
      const SIZE = 25;

      const SHAPES = [
        { color: '#38bdf8', matrix: [[1, 1, 1, 1]] },
        { color: '#fbbf24', matrix: [[1, 1], [1, 1]] },
        { color: '#a78bfa', matrix: [[0, 1, 0], [1, 1, 1]] },
        { color: '#10b981', matrix: [[0, 1, 1], [1, 1, 0]] },
        { color: '#ef4444', matrix: [[1, 1, 0], [0, 1, 1]] },
        { color: '#3b82f6', matrix: [[1, 0, 0], [1, 1, 1]] },
        { color: '#f97316', matrix: [[0, 0, 1], [1, 1, 1]] },
      ];

      let grid = [];
      let current = null;
      let nextPiece = null;
      let score = 0;
      let lines = 0;
      let level = 1;
      let running = false;
      let paused = false;
      let dropCounter = 0;
      let lastTime = 0;

      function randomPiece() {
        const def = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        const matrix = def.matrix.map((row) => [...row]);
        return {
          color: def.color,
          matrix,
          x: Math.floor((COLS - matrix[0].length) / 2),
          y: 0,
        };
      }

      function collides(piece, dx = 0, dy = 0, mat = piece.matrix) {
        for (let r = 0; r < mat.length; r++) {
          for (let c = 0; c < mat[r].length; c++) {
            if (!mat[r][c]) continue;
            const nx = piece.x + c + dx;
            const ny = piece.y + r + dy;
            if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
            if (ny >= 0 && grid[ny][nx]) return true;
          }
        }
        return false;
      }

      function rotateMatrix(mat) {
        return mat[0].map((_, c) => mat.map((row) => row[c]).reverse());
      }

      function lockPiece() {
        for (let r = 0; r < current.matrix.length; r++) {
          for (let c = 0; c < current.matrix[r].length; c++) {
            if (current.matrix[r][c]) {
              const y = current.y + r;
              if (y < 0) {
                endGame();
                return;
              }
              grid[y][current.x + c] = current.color;
            }
          }
        }
        let cleared = 0;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r].every(Boolean)) {
            grid.splice(r, 1);
            grid.unshift(Array(COLS).fill(null));
            cleared++;
            r++;
          }
        }
        if (cleared > 0) {
          lines += cleared;
          score += [0, 100, 300, 500, 800][cleared] * level;
          level = Math.floor(lines / 10) + 1;
          syncHud();
        }
        current = nextPiece;
        nextPiece = randomPiece();
        drawNext();
        if (collides(current)) {
          endGame();
        }
      }

      function endGame() {
        running = false;
        overlayTitle.textContent = 'Game Over';
        overlayText.textContent = `Score: ${score} · Lines cleared: ${lines}`;
        startBtn.textContent = 'Play Again';
        overlay.hidden = false;
      }

      function startGame() {
        grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        score = 0;
        lines = 0;
        level = 1;
        paused = false;
        running = true;
        pauseBtn.textContent = 'Pause';
        current = randomPiece();
        nextPiece = randomPiece();
        syncHud();
        drawNext();
        overlay.hidden = true;
      }

      function syncHud() {
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;
      }

      function drawNext() {
        nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (!nextPiece) return;
        const s = 20;
        const m = nextPiece.matrix;
        const ox = (nextCanvas.width - m[0].length * s) / 2;
        const oy = (nextCanvas.height - m.length * s) / 2;
        nextCtx.fillStyle = nextPiece.color;
        for (let r = 0; r < m.length; r++) {
          for (let c = 0; c < m[r].length; c++) {
            if (m[r][c]) {
              nextCtx.fillRect(ox + c * s + 1, oy + r * s + 1, s - 2, s - 2);
            }
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        for (let x = 1; x < COLS; x++) {
          ctx.beginPath();
          ctx.moveTo(x * SIZE, 0);
          ctx.lineTo(x * SIZE, canvas.height);
          ctx.stroke();
        }
        for (let y = 1; y < ROWS; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * SIZE);
          ctx.lineTo(canvas.width, y * SIZE);
          ctx.stroke();
        }

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (grid[r][c]) {
              ctx.fillStyle = grid[r][c];
              ctx.fillRect(c * SIZE + 1, r * SIZE + 1, SIZE - 2, SIZE - 2);
            }
          }
        }

        if (!current) return;

        let ghostY = current.y;
        while (!collides(current, 0, ghostY - current.y + 1)) ghostY++;
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        for (let r = 0; r < current.matrix.length; r++) {
          for (let c = 0; c < current.matrix[r].length; c++) {
            if (current.matrix[r][c]) {
              ctx.fillRect((current.x + c) * SIZE + 1, (ghostY + r) * SIZE + 1, SIZE - 2, SIZE - 2);
            }
          }
        }

        ctx.fillStyle = current.color;
        for (let r = 0; r < current.matrix.length; r++) {
          for (let c = 0; c < current.matrix[r].length; c++) {
            if (current.matrix[r][c]) {
              ctx.fillRect((current.x + c) * SIZE + 1, (current.y + r) * SIZE + 1, SIZE - 2, SIZE - 2);
            }
          }
        }
      }

      function loop(ts) {
        const dt = ts - lastTime;
        lastTime = ts;
        if (running && !paused) {
          dropCounter += dt;
          const interval = Math.max(120, 720 - (level - 1) * 65);
          if (dropCounter > interval) {
            if (!collides(current, 0, 1)) {
              current.y += 1;
            } else {
              lockPiece();
            }
            dropCounter = 0;
          }
        }
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(e.key)) {
          e.preventDefault();
        }
        if (!running || paused) return;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
          if (!collides(current, -1, 0)) current.x -= 1;
        } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
          if (!collides(current, 1, 0)) current.x += 1;
        } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
          if (!collides(current, 0, 1)) {
            current.y += 1;
            score += 1;
            syncHud();
          }
        } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
          const rot = rotateMatrix(current.matrix);
          if (!collides(current, 0, 0, rot)) current.matrix = rot;
        } else if (e.code === 'Space') {
          while (!collides(current, 0, 1)) {
            current.y += 1;
            score += 2;
          }
          syncHud();
          lockPiece();
          dropCounter = 0;
        }
      });

      pauseBtn.addEventListener('click', () => {
        if (!running) return;
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      });

      startBtn.addEventListener('click', startGame);
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
