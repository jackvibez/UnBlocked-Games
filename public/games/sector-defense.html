<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sector Defense</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        color: #f3f5f8;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .wrap {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        gap: 10px;
      }
      .hud {
        width: 100%;
        max-width: 760px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 14px;
        background: #161a22;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .hud-stats {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .hud-label {
        color: #8b95a5;
        margin-right: 4px;
      }
      .hud-val {
        font-weight: 700;
        color: #f3f5f8;
      }
      .hud-btn {
        background: #212733;
        color: #f3f5f8;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .hud-btn:hover {
        background: #2b3242;
      }
      .stage {
        position: relative;
        width: 100%;
        max-width: 760px;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        width: 100%;
        height: 100%;
        max-height: 100%;
        background: #0f131b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: rgba(11, 13, 18, 0.84);
        border-radius: 12px;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .overlay p {
        margin: 0 0 18px;
        color: #9aa4b2;
        font-size: 14px;
        max-width: 380px;
        line-height: 1.5;
      }
      .btn-play {
        background: #f59e0b;
        color: #11141a;
        border: 0;
        border-radius: 8px;
        padding: 11px 22px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-play:hover {
        background: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hud">
        <div class="hud-stats">
          <div><span class="hud-label">Score</span><span id="scoreVal" class="hud-val">0</span></div>
          <div><span class="hud-label">Wave</span><span id="waveVal" class="hud-val">1</span></div>
          <div><span class="hud-label">Shield</span><span id="livesVal" class="hud-val">3</span></div>
          <div><span class="hud-label">Best</span><span id="bestVal" class="hud-val">0</span></div>
        </div>
        <div>
          <button type="button" id="muteBtn" class="hud-btn">Sound On</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="canvas" width="760" height="500"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlayTitle">Sector Defense</h1>
          <p id="overlayText">Move with Left/Right arrows or A/D. Hold or tap Space to fire plasma bolts. Clear each drone formation before they breach the line.</p>
          <button type="button" id="startBtn" class="btn-play">Start Game</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');
      const muteBtn = document.getElementById('muteBtn');
      const scoreEl = document.getElementById('scoreVal');
      const waveEl = document.getElementById('waveVal');
      const livesEl = document.getElementById('livesVal');
      const bestEl = document.getElementById('bestVal');

      const BEST_KEY = 'arcadevault_sector_best';
      let bestScore = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = bestScore;

      let muted = false;
      let audioCtx = null;
      function beep(freq, dur, type = 'triangle', vol = 0.06) {
        if (muted) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? 'Sound Off' : 'Sound On';
      });

      const keys = {};
      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.key)) {
          e.preventDefault();
        }
        keys[e.code] = true;
      });
      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      const stars = Array.from({ length: 65 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        s: Math.random() * 1.8 + 0.6,
        v: Math.random() * 18 + 8,
      }));

      let game = null;
      let lastTime = 0;

      function spawnWave(wave) {
        const rows = Math.min(3 + Math.floor((wave - 1) / 2), 5);
        const cols = 8;
        const drones = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            drones.push({
              x: 95 + c * 74,
              y: 52 + r * 42,
              w: 34,
              h: 22,
              hp: r === 0 && wave >= 2 ? 2 : 1,
              alive: true,
              tier: r === 0 ? 2 : 1,
            });
          }
        }
        return drones;
      }

      function resetGame() {
        game = {
          running: true,
          score: 0,
          wave: 1,
          lives: 3,
          player: { x: canvas.width / 2, y: canvas.height - 38, w: 40, h: 24, cooldown: 0, invuln: 0 },
          bullets: [],
          enemyBullets: [],
          particles: [],
          drones: spawnWave(1),
          dir: 1,
          droneSpeed: 48,
          shootTimer: 1.1,
        };
        syncHud();
        overlay.hidden = true;
      }

      function syncHud() {
        if (!game) return;
        scoreEl.textContent = game.score;
        waveEl.textContent = game.wave;
        livesEl.textContent = game.lives;
        if (game.score > bestScore) {
          bestScore = game.score;
          localStorage.setItem(BEST_KEY, String(bestScore));
          bestEl.textContent = bestScore;
        }
      }

      function burst(x, y, color) {
        for (let i = 0; i < 10; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 40 + Math.random() * 140;
          game.particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 0.35 + Math.random() * 0.25,
            color,
          });
        }
      }

      function endGame() {
        game.running = false;
        overlayTitle.textContent = 'Game Over';
        overlayText.textContent = `Final score: ${game.score} across Wave ${game.wave}. Ready for another run?`;
        startBtn.textContent = 'Play Again';
        overlay.hidden = false;
      }

      function update(dt) {
        for (const st of stars) {
          st.y += st.v * dt;
          if (st.y > canvas.height) {
            st.y = 0;
            st.x = Math.random() * canvas.width;
          }
        }

        if (!game || !game.running) return;

        const p = game.player;
        const speed = 340;
        if (keys['ArrowLeft'] || keys['KeyA']) p.x -= speed * dt;
        if (keys['ArrowRight'] || keys['KeyD']) p.x += speed * dt;
        p.x = Math.max(28, Math.min(canvas.width - 28, p.x));

        if (p.cooldown > 0) p.cooldown -= dt;
        if (p.invuln > 0) p.invuln -= dt;

        if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && p.cooldown <= 0) {
          game.bullets.push({ x: p.x, y: p.y - 16, vy: -520 });
          p.cooldown = 0.22;
          beep(520, 0.06, 'square', 0.04);
        }

        for (const b of game.bullets) b.y += b.vy * dt;
        game.bullets = game.bullets.filter((b) => b.y > -20);

        for (const eb of game.enemyBullets) eb.y += eb.vy * dt;
        game.enemyBullets = game.enemyBullets.filter((eb) => eb.y < canvas.height + 20);

        const alive = game.drones.filter((d) => d.alive);
        let hitEdge = false;
        const stepX = game.dir * (game.droneSpeed + game.wave * 10) * dt;
        for (const d of alive) {
          d.x += stepX;
          if (d.x > canvas.width - 34 || d.x < 34) hitEdge = true;
        }
        if (hitEdge) {
          game.dir *= -1;
          for (const d of alive) {
            d.y += 18;
            if (d.y >= p.y - 16) {
              game.lives = 0;
              syncHud();
              endGame();
              return;
            }
          }
        }

        game.shootTimer -= dt;
        if (game.shootTimer <= 0 && alive.length > 0) {
          const shooter = alive[Math.floor(Math.random() * alive.length)];
          game.enemyBullets.push({ x: shooter.x, y: shooter.y + 12, vy: 220 + game.wave * 24 });
          game.shootTimer = Math.max(0.35, 1.05 - game.wave * 0.08);
        }

        for (const b of game.bullets) {
          for (const d of alive) {
            if (d.alive && Math.abs(b.x - d.x) < d.w / 2 + 4 && Math.abs(b.y - d.y) < d.h / 2 + 6) {
              b.y = -999;
              d.hp -= 1;
              if (d.hp <= 0) {
                d.alive = false;
                game.score += d.tier === 2 ? 40 : 20;
                burst(d.x, d.y, d.tier === 2 ? '#fbbf24' : '#38bdf8');
                beep(220, 0.09, 'sawtooth', 0.05);
              } else {
                beep(340, 0.05, 'triangle', 0.04);
              }
              syncHud();
              break;
            }
          }
        }

        if (p.invuln <= 0) {
          for (const eb of game.enemyBullets) {
            if (Math.abs(eb.x - p.x) < 18 && Math.abs(eb.y - p.y) < 14) {
              eb.y = 9999;
              game.lives -= 1;
              p.invuln = 1.4;
              burst(p.x, p.y, '#ef4444');
              beep(120, 0.22, 'sawtooth', 0.08);
              syncHud();
              if (game.lives <= 0) {
                endGame();
                return;
              }
            }
          }
        }

        for (const pt of game.particles) {
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.life -= dt;
        }
        game.particles = game.particles.filter((pt) => pt.life > 0);

        if (game.drones.every((d) => !d.alive)) {
          game.wave += 1;
          game.score += 100;
          game.drones = spawnWave(game.wave);
          beep(640, 0.16, 'triangle', 0.06);
          syncHud();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        for (const st of stars) {
          ctx.fillRect(st.x, st.y, st.s, st.s);
        }

        if (!game) return;

        for (const d of game.drones) {
          if (!d.alive) continue;
          ctx.save();
          ctx.translate(d.x, d.y);
          ctx.fillStyle = d.hp > 1 ? '#f59e0b' : d.tier === 2 ? '#a78bfa' : '#38bdf8';
          ctx.beginPath();
          ctx.moveTo(0, 11);
          ctx.lineTo(16, -7);
          ctx.lineTo(6, -11);
          ctx.lineTo(-6, -11);
          ctx.lineTo(-16, -7);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#0f131b';
          ctx.fillRect(-5, -4, 3, 4);
          ctx.fillRect(2, -4, 3, 4);
          ctx.restore();
        }

        ctx.fillStyle = '#fbbf24';
        for (const b of game.bullets) {
          ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
        }

        ctx.fillStyle = '#f87171';
        for (const eb of game.enemyBullets) {
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const pt of game.particles) {
          ctx.globalAlpha = Math.max(0, pt.life * 2);
          ctx.fillStyle = pt.color;
          ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;

        const p = game.player;
        if (p.invuln <= 0 || Math.floor(p.invuln * 12) % 2 === 0) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.fillStyle = '#f3f5f8';
          ctx.beginPath();
          ctx.moveTo(0, -14);
          ctx.lineTo(18, 10);
          ctx.lineTo(6, 6);
          ctx.lineTo(-6, 6);
          ctx.lineTo(-18, 10);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-3, -4, 6, 8);
          ctx.restore();
        }
      }

      function loop(ts) {
        const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0);
        lastTime = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      startBtn.addEventListener('click', resetGame);
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
