<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Breaker</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        color: #f3f5f8;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .wrap {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        gap: 10px;
      }
      .hud {
        width: 100%;
        max-width: 760px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: #161a22;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .hud-stats {
        display: flex;
        gap: 18px;
      }
      .hud-label {
        color: #8b95a5;
        margin-right: 4px;
      }
      .hud-val {
        font-weight: 700;
      }
      .hud-btn {
        background: #212733;
        color: #f3f5f8;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .stage {
        position: relative;
        width: 100%;
        max-width: 760px;
        flex: 1;
        min-height: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        background: #10141c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: rgba(11, 13, 18, 0.85);
        border-radius: 12px;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .overlay p {
        margin: 0 0 18px;
        color: #9aa4b2;
        font-size: 14px;
        max-width: 380px;
      }
      .btn-play {
        background: #f59e0b;
        color: #11141a;
        border: 0;
        border-radius: 8px;
        padding: 11px 22px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hud">
        <div class="hud-stats">
          <div><span class="hud-label">Score</span><span id="scoreVal" class="hud-val">0</span></div>
          <div><span class="hud-label">Stage</span><span id="stageVal" class="hud-val">1</span></div>
          <div><span class="hud-label">Lives</span><span id="livesVal" class="hud-val">3</span></div>
          <div><span class="hud-label">Best</span><span id="bestVal" class="hud-val">0</span></div>
        </div>
        <button type="button" id="muteBtn" class="hud-btn">Sound On</button>
      </div>

      <div class="stage">
        <canvas id="canvas" width="760" height="500"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlayTitle">Brick Breaker</h1>
          <p id="overlayText">Move the paddle with your mouse or Left/Right arrow keys. Press Space or click to launch the ball.</p>
          <button type="button" id="startBtn" class="btn-play">Start Game</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');
      const muteBtn = document.getElementById('muteBtn');
      const scoreEl = document.getElementById('scoreVal');
      const stageEl = document.getElementById('stageVal');
      const livesEl = document.getElementById('livesVal');
      const bestEl = document.getElementById('bestVal');

      const BEST_KEY = 'arcadevault_brick_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = best;

      let muted = false;
      let audioCtx = null;
      function beep(freq, dur) {
        if (muted) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.06, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start();
          o.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? 'Sound Off' : 'Sound On';
      });

      const ROW_COLORS = ['#ef4444', '#f59e0b', '#eab308', '#10b981', '#38bdf8'];
      const keys = {};
      let state = null;
      let lastTime = 0;

      function createBricks(stage) {
        const bricks = [];
        const rows = Math.min(5, 3 + stage);
        const cols = 10;
        const pad = 8;
        const offsetX = 28;
        const offsetY = 42;
        const bw = (canvas.width - offsetX * 2 - pad * (cols - 1)) / cols;
        const bh = 22;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            bricks.push({
              x: offsetX + c * (bw + pad),
              y: offsetY + r * (bh + pad),
              w: bw,
              h: bh,
              hp: r === 0 && stage > 1 ? 2 : 1,
              color: ROW_COLORS[r % ROW_COLORS.length],
            });
          }
        }
        return bricks;
      }

      function resetBall() {
        state.ball = {
          x: state.paddle.x,
          y: state.paddle.y - 12,
          r: 8,
          vx: 240 * (Math.random() > 0.5 ? 1 : -1),
          vy: -310,
          stuck: true,
        };
      }

      function startGame() {
        state = {
          running: true,
          score: 0,
          stage: 1,
          lives: 3,
          paddle: { x: canvas.width / 2, y: canvas.height - 28, w: 112, h: 14 },
          bricks: createBricks(1),
          ball: null,
        };
        resetBall();
        syncHud();
        overlay.hidden = true;
      }

      function syncHud() {
        scoreEl.textContent = state.score;
        stageEl.textContent = state.stage;
        livesEl.textContent = state.lives;
        if (state.score > best) {
          best = state.score;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = best;
        }
      }

      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
        keys[e.code] = true;
        if (e.code === 'Space' && state && state.running && state.ball.stuck) {
          state.ball.stuck = false;
          beep(440, 0.06);
        }
      });
      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!state || !state.running) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        state.paddle.x = Math.max(
          state.paddle.w / 2 + 8,
          Math.min(canvas.width - state.paddle.w / 2 - 8, (e.clientX - rect.left) * scaleX)
        );
      });

      canvas.addEventListener('click', () => {
        if (state && state.running && state.ball.stuck) {
          state.ball.stuck = false;
          beep(440, 0.06);
        }
      });

      function update(dt) {
        if (!state || !state.running) return;

        const p = state.paddle;
        if (keys['ArrowLeft'] || keys['KeyA']) p.x -= 480 * dt;
        if (keys['ArrowRight'] || keys['KeyD']) p.x += 480 * dt;
        p.x = Math.max(p.w / 2 + 8, Math.min(canvas.width - p.w / 2 - 8, p.x));

        const b = state.ball;
        if (b.stuck) {
          b.x = p.x;
          b.y = p.y - 14;
          return;
        }

        b.x += b.vx * dt;
        b.y += b.vy * dt;

        if (b.x - b.r < 0) {
          b.x = b.r;
          b.vx = Math.abs(b.vx);
          beep(320, 0.04);
        } else if (b.x + b.r > canvas.width) {
          b.x = canvas.width - b.r;
          b.vx = -Math.abs(b.vx);
          beep(320, 0.04);
        }

        if (b.y - b.r < 0) {
          b.y = b.r;
          b.vy = Math.abs(b.vy);
          beep(320, 0.04);
        }

        if (
          b.vy > 0 &&
          b.y + b.r >= p.y - p.h / 2 &&
          b.y - b.r <= p.y + p.h / 2 &&
          b.x >= p.x - p.w / 2 - 4 &&
          b.x <= p.x + p.w / 2 + 4
        ) {
          const hitOffset = (b.x - p.x) / (p.w / 2);
          const speed = Math.min(540, Math.hypot(b.vx, b.vy) * 1.015);
          const angle = hitOffset * (Math.PI / 3);
          b.vx = Math.sin(angle) * speed;
          b.vy = -Math.cos(angle) * speed;
          b.y = p.y - p.h / 2 - b.r;
          beep(460, 0.05);
        }

        for (const br of state.bricks) {
          if (br.hp <= 0) continue;
          if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
            br.hp -= 1;
            b.vy = -b.vy;
            state.score += br.hp === 0 ? 15 : 5;
            beep(br.hp === 0 ? 600 : 380, 0.06);
            syncHud();
            break;
          }
        }

        if (b.y - b.r > canvas.height) {
          state.lives -= 1;
          beep(150, 0.2);
          syncHud();
          if (state.lives <= 0) {
            state.running = false;
            overlayTitle.textContent = 'Game Over';
            overlayText.textContent = `Final score: ${state.score} on Stage ${state.stage}.`;
            startBtn.textContent = 'Play Again';
            overlay.hidden = false;
            return;
          }
          resetBall();
        }

        if (state.bricks.every((br) => br.hp <= 0)) {
          state.stage += 1;
          state.score += 100;
          state.bricks = createBricks(state.stage);
          resetBall();
          syncHud();
          beep(720, 0.14);
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!state) return;

        for (const br of state.bricks) {
          if (br.hp <= 0) continue;
          ctx.fillStyle = br.color;
          ctx.beginPath();
          ctx.roundRect(br.x, br.y, br.w, br.h, 4);
          ctx.fill();
          if (br.hp > 1) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }

        const p = state.paddle;
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.roundRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, 6);
        ctx.fill();

        const b = state.ball;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop(ts) {
        const dt = Math.min(0.03, (ts - lastTime) / 1000 || 0);
        lastTime = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      startBtn.addEventListener('click', startGame);
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
